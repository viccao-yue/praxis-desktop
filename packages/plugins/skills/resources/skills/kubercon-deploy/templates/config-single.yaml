# 单节点样例 —— 使用前必须替换 IP、node1 上的私钥路径、版本
# apiVersion 以现场 `./kc create config`（或 ./kk）生成为准；本文件仅作结构参考
# etcd.type 必须是 kubekey（安装器源码只认 kubekey|kubeadm|external）。
# 写成 kubercon 会跳过 etcd 安装，控制面起不来。若 create config 生成了别的值，停下来问人。
apiVersion: kubekey.kubesphere.io/v1alpha2
kind: Cluster
metadata:
  name: sample
spec:
  hosts:
  - {name: node1, arch: amd64, address: 10.10.10.11, internalAddress: 10.10.10.11, user: root, privateKeyPath: "/root/.ssh/id_rsa"}
  roleGroups:
    etcd:
    - node1
    control-plane:
    - node1
    worker:
    - node1
    registry:
    - node1
  controlPlaneEndpoint:
    domain: lb.kubercon.local
    address: ""
    port: 6443
  kubernetes:
    version: v1.28.15
    clusterName: cluster.local
    autoRenewCerts: true
    containerManager: containerd
  etcd:
    type: kubekey
  network:
    plugin: calico
    kubePodsCIDR: 10.233.64.0/18
    kubeServiceCIDR: 10.233.0.0/18
    multusCNI:
      enabled: false
  storage:
    openebs:
      basePath: /var/openebs/local
  registry:
    type: registry
    privateRegistry: "docker.kubercon.local"
    # V22.6 离线包镜像在仓库命名空间 kubercon/（pause 等）；留空时 kk 常误用 kubesphere/
    namespaceOverride: "kubercon"
    registryMirrors: []
    insecureRegistries: []
    auths: {}
  addons: []
